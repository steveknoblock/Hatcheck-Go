// ── Create relation ──
async function createRelation() {
    const rel = document.getElementById('rel-type-input').value.trim();
    if (!currentHash || !rel || !relToHash) return;

    const btn = document.getElementById('rel-create-btn');
    btn.disabled = true;
    btn.textContent = 'Creating…';

    try {
        // relationHandler expects a JSON body — {"from":..., "rel":...,
        // "to":...} — not query params. This previously sent from/rel/to
        // as query params with an empty body, which always 400'd against
        // the current server-side handler.
        const res = await apiFetch(`${API}/relation`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ from: currentHash, rel, to: relToHash }),
        });
        if (!res.ok) throw new Error(await res.text());
        const relData = await res.json();
        const hash = relData.hash;

        // Store the capability issued for this relation object.
        if (relData.capability) {
            const caps = JSON.parse(sessionStorage.getItem('capabilities') || '{}');
            caps[hash] = relData.capability;
            sessionStorage.setItem('capabilities', JSON.stringify(caps));
            if (!browseCapToken) {
                browseCapToken = JSON.stringify(relData.capability);
                sessionStorage.setItem('browse_cap_token', browseCapToken);
            }
        }

        showToast('Relation created', hash);
        resetRelForm();

        // Refresh relations display.
        await loadRelationsPanel(currentHash);

    } catch(err) {
        showToast('Error', err.message, true);
    } finally {
        btn.textContent = 'Create relation';
        updateCreateBtn();
    }
}

function resetRelForm() {
    document.getElementById('rel-type-input').value = '';
    document.getElementById('rel-to-input').value   = '';
    relToHash  = null;
    relToLabel = null;
    relTypeSelected = -1;
    relToSelected   = -1;
    hideRelPreview();
    updateCreateBtn();
}

// ── Collection builder ──
// Unlike Relations (a property of whatever object is currently open),
// building a Collection means composing several existing objects into a
// new one — there's no single "current object" it's a property of. So
// this is a mode entered via the header button, replacing the whole
// tab-strip/editor/relations area rather than living alongside it as a
// third tab. Reuses the same allNamesFlat + .rel-ac-* search/dropdown
// pattern Relations' "to" picker already established, just for adding
// members instead of picking a relation target.
let cbMembers = []; // ordered [{label, hash}, ...]

function newCollection() {
    if (editorDirty && !confirm('You have unsaved changes. Continue?')) return;

    cbMembers = [];
    document.getElementById('cb-add-input').value = '';
    renderCbMembers();

    document.getElementById('tab-strip').style.display = 'none';
    document.getElementById('editor-header').style.display = 'none';
    document.querySelector('.tab-panels').style.display = 'none';
    document.getElementById('collection-builder-view').style.display = 'flex';

    pathStack    = [];
    currentHash  = null;
    currentLabel = null;
    editorDirty  = false;
    renderBreadcrumb();

    showToast('New collection', 'Search for objects above to add them, in order.');
}

function cancelCollectionBuilder() {
    document.getElementById('collection-builder-view').style.display = 'none';
    document.getElementById('tab-strip').style.display = '';
    document.querySelector('.tab-panels').style.display = '';
    switchTab('editor'); // also restores editor-header's visibility correctly

}

function renderCbAddDropdown(val) {
    const dropdown = document.getElementById('cb-add-dropdown');
    const filtered = val
        ? allNamesFlat.filter(n => n.label.toLowerCase().includes(val.toLowerCase()))
        : allNamesFlat;

    if (filtered.length === 0) {
        dropdown.classList.remove('visible');
        return;
    }

    dropdown.innerHTML = filtered.map(n => `
        <div class="rel-ac-option" onmousedown="addCbMember('${escAttr(n.label)}', '${escAttr(n.hash)}')">
            ${escHtml(n.label)}
        </div>
    `).join('');
    dropdown.classList.add('visible');

// Duplicates are allowed on purpose — a Collection is just a JSON array
// of hashes, and there's no reason the same object couldn't legitimately
// appear more than once (e.g. repeating an image).
function addCbMember(label, hash) {
    cbMembers.push({ label, hash });
    document.getElementById('cb-add-input').value = '';
    document.getElementById('cb-add-dropdown').classList.remove('visible');
    renderCbMembers();
}

function renderCbMembers() {
    const container = document.getElementById('cb-members');
    const createBtn = document.getElementById('cb-create-btn');
    createBtn.disabled = cbMembers.length === 0;
    createBtn.textContent = cbMembers.length
        ? `Create collection (${cbMembers.length} member${cbMembers.length !== 1 ? 's' : ''})`
        : 'Create collection';

    if (!cbMembers.length) {
        container.innerHTML = '<div class="empty-state">No members yet — search above to add objects.</div>';
        return;
    }

    container.innerHTML = cbMembers.map((m, i) => `
        <div class="cb-member-row">
            <span class="cb-member-index">${i + 1}</span>
            <span class="cb-member-label" title="${escAttr(m.hash)}">${escHtml(m.label)}</span>
            <div class="cb-member-btns">
                <button class="cb-member-btn" onclick="moveCbMember(${i}, -1)" ${i === 0 ? 'disabled' : ''} title="Move up">↑</button>
                <button class="cb-member-btn" onclick="moveCbMember(${i}, 1)" ${i === cbMembers.length - 1 ? 'disabled' : ''} title="Move down">↓</button>
                <button class="cb-member-btn" onclick="removeCbMember(${i})" title="Remove">✕</button>
            </div>
        </div>
    `).join('');
}

function moveCbMember(index, direction) {
    const newIndex = index + direction;
    if (newIndex < 0 || newIndex >= cbMembers.length) return;
    [cbMembers[index], cbMembers[newIndex]] = [cbMembers[newIndex], cbMembers[index]];
    renderCbMembers();
}

function removeCbMember(index) {
    cbMembers.splice(index, 1);
    renderCbMembers();
}

async function createCollection() {
    if (!namespace) {
        showToast('Error', 'Enter a namespace first', true);
        return;
    }
    if (!cbMembers.length) return;

    const btn = document.getElementById('cb-create-btn');
    btn.disabled = true;
    btn.textContent = 'Creating…';

    try {
        const hashes = cbMembers.map(m => m.hash);
        const res = await apiFetch(`${API}/collection`, {
            method: 'POST',
            body: JSON.stringify(hashes),
            headers: { 'Content-Type': 'application/json' }
        });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        const hash = data.hash;

        // Store the capability issued for this collection object — same
        // pattern saveContent() and createRelation() already use.
        if (data.capability) {
            const caps = JSON.parse(sessionStorage.getItem('capabilities') || '{}');
            caps[hash] = data.capability;
            sessionStorage.setItem('capabilities', JSON.stringify(caps));
            capabilityToken = JSON.stringify(data.capability);
            sessionStorage.setItem('capability_token', capabilityToken);
            if (!browseCapToken) {
                browseCapToken = capabilityToken;
                sessionStorage.setItem('browse_cap_token', browseCapToken);
            }
        }

        const label = prompt('Enter a name for this collection:');
        if (!label) {
            // Same choice saveContent() makes for an unnamed save: the
            // object exists in the CAS either way, naming it is optional.
            showToast('Collection created', `Hash: ${hash} (not named yet)`);
            cancelCollectionBuilder();
            return;
        }

        const nameRes = await apiFetch(
            `${API}/name?namespace=${encodeURIComponent(namespace)}&label=${encodeURIComponent(label)}&hash=${hash}`,
            { method: 'POST' }
        );
        if (!nameRes.ok) throw new Error('Name creation failed');

        const listRes = await apiFetch(`${API}/names?namespace=${encodeURIComponent(namespace)}`);
        nameList = await listRes.json();

        showToast('Collection created', `${label} (${cbMembers.length} member${cbMembers.length !== 1 ? 's' : ''})`);

        cancelCollectionBuilder();
        renderNameList();
        await navigateToHash(hash); // land on the new collection so it's visibly confirmed, not just a toast

    } catch (err) {
        showToast('Error', err.message, true);
        btn.disabled = false;
        btn.textContent = `Create collection (${cbMembers.length} member${cbMembers.length !== 1 ? 's' : ''})`;
    }
}

// ── Save (path copying) ──
async function saveContent() {
    if (!namespace) {
        showToast('Error', 'Enter a namespace first', true);
        return;
    }
    const content = document.getElementById('editor').value;
    const saveBtn = document.getElementById('save-btn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    try {
        const stashRes = await apiFetch(`${API}/stash`, { method: 'POST', body: content });
        if (!stashRes.ok) throw new Error('Stash failed');
        const stashData = await stashRes.json();
        let newHash = stashData.hash;

        // Store the capability issued by the server for this object.
        // This binds ownership to the current user.
        if (stashData.capability) {
            const caps = JSON.parse(sessionStorage.getItem('capabilities') || '{}');
            caps[newHash] = stashData.capability;
            sessionStorage.setItem('capabilities', JSON.stringify(caps));
            // Update active capability token to the one just issued.
            capabilityToken = JSON.stringify(stashData.capability);
            sessionStorage.setItem('capability_token', capabilityToken);
            // Seed the browse capability if we don't have one yet.
            // Any valid capability satisfies the PermRead check on metadata endpoints.
            if (!browseCapToken) {
                browseCapToken = capabilityToken;
                sessionStorage.setItem('browse_cap_token', browseCapToken);
            }
        }
        for (let i = pathStack.length - 2; i >= 1; i--) {
            const parentFrame    = pathStack[i];
            const childIndex     = pathStack[i].index;
            const updatedMembers = [...parentFrame.members];
            updatedMembers[childIndex] = newHash;

            const colRes = await apiFetch(`${API}/collection`, {
                method: 'POST',
                body: JSON.stringify(updatedMembers),
                headers: { 'Content-Type': 'application/json' }
            });
            if (!colRes.ok) throw new Error('Collection stash failed');
            const colData = await colRes.json();
            newHash = colData.hash;

            // Store the capability issued for this collection object.
            if (colData.capability) {
                const caps = JSON.parse(sessionStorage.getItem('capabilities') || '{}');
                caps[newHash] = colData.capability;
                sessionStorage.setItem('capabilities', JSON.stringify(caps));
                if (!browseCapToken) {
                    browseCapToken = JSON.stringify(colData.capability);
                    sessionStorage.setItem('browse_cap_token', browseCapToken);
                }
            }
        }

        if (pathStack.length > 0) {
            const nameFrame = pathStack[0];
            const label     = nameFrame.label;
            const nameRes   = await apiFetch(
                `${API}/name?namespace=${encodeURIComponent(namespace)}&label=${encodeURIComponent(label)}&hash=${newHash}`,
                { method: 'POST' }
            );
            if (!nameRes.ok) throw new Error('Name update failed');
            currentLabel = label;
        } else {
            const label = prompt('Enter a name for this object:');
            if (!label) {
                showToast('Saved', `Hash: ${newHash}`);
                renderEditor(newHash, content);
                return;
            }
            const nameRes = await apiFetch(
                `${API}/name?namespace=${encodeURIComponent(namespace)}&label=${encodeURIComponent(label)}&hash=${newHash}`,
                { method: 'POST' }
            );
            if (!nameRes.ok) throw new Error('Name creation failed');
            currentLabel = label;

            const listRes = await apiFetch(`${API}/names?namespace=${encodeURIComponent(namespace)}`);
            nameList = await listRes.json();
        }

        currentHash = newHash;
        editorDirty = false;
        renderEditor(newHash, content);
        renderBreadcrumb();

        const listRes = await apiFetch(`${API}/names?namespace=${encodeURIComponent(namespace)}`);
        nameList = await listRes.json();
        renderNameList();

        showToast('Saved', newHash);

    } catch (err) {
        showToast('Error', err.message, true);
    } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save';
    }
}

// ── Breadcrumb ──
function renderBreadcrumb() {
    const el = document.getElementById('breadcrumb');

    if (pathStack.length === 0) {
        el.innerHTML = `<span style="color:var(--text-muted);font-size:11px">${namespace || 'No selection'}</span>`;
        return;
    }

    // Intermediate frames are almost always anonymous path-copy wrapper
    // collections (see the Path Copying architecture note) with no name of
    // their own, so a deep drill-down used to render as a wall of hash
    // segments. Show only the root (named) frame and the current position;
    // clicking the root still jumps straight back to it via navigateTo(0).
    const rootIdx = 0;
    const lastIdx = pathStack.length - 1;
    const indices = lastIdx === rootIdx ? [rootIdx] : [rootIdx, lastIdx];

    const parts = indices.map((i) => {
        const frame = pathStack[i];
        const isLast = i === lastIdx;
        if (isLast) {
            return `<span class="crumb-current">${escHtml(frame.label)}</span>`;
        }
        return `<span class="crumb" onclick="navigateTo(${i})">${escHtml(frame.label)}</span>`;
    });

    const ns = namespace
        ? `<span class="crumb" onclick="loadNamespace()">${escHtml(namespace)}</span><span class="crumb-sep"> / </span>`
        : '';

    el.innerHTML = ns + parts.join('<span class="crumb-sep"> / </span>');
}

// ── Export ──
// Exports the whole current namespace as a tar.gz archive — every name
// currently defined in it, and everything reachable from those names.
// Previously this button ("Share") exported just the single open
// document; it now covers the whole namespace, so it lives in the top
// toolbar rather than the per-document editor header, and only needs a
// namespace loaded rather than a document open.
async function exportNamespace() {
    if (!namespace) return;

    const url = `${API}/export?source=${encodeURIComponent(namespace)}&namespace=${encodeURIComponent(namespace)}`;

    // A plain <a href="..."> navigation sends no custom headers at all —
    // not Authorization, not X-User-ID, not X-Capability-Token — so it
    // always 401s against an auth-gated endpoint regardless of who's
    // asking. Fetch it through apiFetch (which attaches those headers)
    // and download the resulting blob instead.
    try {
        const res = await apiFetch(url);
        if (!res.ok) {
            const msg = await res.text();
            throw new Error(msg || `HTTP ${res.status}`);
        }
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = namespace + '.tar.gz';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);

        showToast('Exported', `${namespace} → ${namespace}.tar.gz`);
    } catch (err) {
        showToast('Export failed', err.message, true);
    }
}

// ── Import ──
function triggerImport() {
    document.getElementById('import-file-input').click();
}

async function handleImportFile(input) {
    const file = input.files[0];
    if (!file) return;

    input.value = '';
    showToast('Importing', file.name);

    try {
        const res = await apiFetch(`${API}/import`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/gzip' },
            body: file,
        });

        if (!res.ok) {
            const msg = await res.text();
            throw new Error(msg);
        }

        const prevNamespaces = [...allNamespaces];
        await fetchNamespaces();
        const newNs = allNamespaces.find(ns => !prevNamespaces.includes(ns));

        if (newNs) {
            document.getElementById('ns-input').value = newNs;
            namespace = newNs;
            await loadNamespace();
            showToast('Imported', `Switched to namespace: ${newNs}`);
        } else {
            showToast('Imported', file.name);
        }

    } catch (err) {
        showToast('Import failed', err.message, true);
    }
}

// ── Helpers ──
function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function escAttr(str) {
    return String(str).replace(/'/g, "\\'");
}

// ── Keyboard nav: namespace input ──
document.getElementById('ns-input').addEventListener('keydown', e => {
    const dropdown = document.getElementById('ns-dropdown');
    const options  = dropdown.querySelectorAll('.ns-option');

    if (e.key === 'Enter') {
        if (nsSelectedIndex >= 0 && options[nsSelectedIndex]) {
            selectNamespace(options[nsSelectedIndex].textContent.trim());
        } else {
            loadNamespace();
        }
        dropdown.classList.remove('visible');
    } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        nsSelectedIndex = Math.min(nsSelectedIndex + 1, options.length - 1);
        renderNsDropdown(document.getElementById('ns-input').value);
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        nsSelectedIndex = Math.max(nsSelectedIndex - 1, -1);
        renderNsDropdown(document.getElementById('ns-input').value);
    } else if (e.key === 'Escape') {
        dropdown.classList.remove('visible');
    }
});
</script>
</body>
</html>
